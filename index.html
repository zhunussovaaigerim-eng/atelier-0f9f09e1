<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3efe8">
<link rel="icon" href="data:,">
<title>Офис ботов</title>
<style>
  :root{--ink:#2b2622;--card:rgba(255,253,249,.88)}
  html,body{margin:0;height:100%;overflow:hidden;background:#efe9df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
  #view{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
  #labels{position:fixed;inset:0;pointer-events:none}
  .lbl{font-size:var(--fs,10px);font-weight:600;white-space:nowrap;padding:.15em .5em;border-radius:.9em;background:rgba(255,255,255,.86);box-shadow:0 1px 3px rgba(0,0,0,.18);display:flex;gap:3px;align-items:center;line-height:1.25}
  .lbl.main{background:#2b2622;color:#fff}
  .lbl .st{font-size:1.05em}
  .lbl.sleep{opacity:.78}
  .zz{font-weight:800;color:#6b7bb5;font-style:italic;animation:zz 2.4s ease-in-out infinite}
  @keyframes zz{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-3px);opacity:1}}
  .bulb{filter:drop-shadow(0 0 4px #ffd94a)}
  .sign{font-size:calc(var(--fs,10px) * 1.1);font-weight:700;letter-spacing:.02em;color:#3d352e;background:rgba(255,250,240,.78);padding:3px 9px;border-radius:6px;border:1px solid rgba(0,0,0,.08);white-space:nowrap}
  .sign.big{font-size:calc(var(--fs,10px) * 1.15);background:#2b2622;color:#f7efe2}
  #top{position:fixed;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:9px 13px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
  #top h1{font-size:17px;margin:0 0 2px}
  #top .sub{font-size:11.5px;opacity:.72}
  #stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:11.5px;background:#fff;border-radius:999px;padding:2px 9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,.14)}
  #bar button{font:inherit;font-size:16px;min-width:46px;height:42px;border:0;border-radius:12px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.09);padding:0 12px}
  #bar button.on{background:#2b2622;color:#fff}
  #bar button.txt{font-size:14px;font-weight:600}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 64px);font-size:11px;background:rgba(43,38,34,.78);color:#fff;padding:4px 10px;border-radius:999px;transition:opacity .8s;white-space:nowrap}
  #err{position:fixed;inset:auto 10px 50% 10px;text-align:center;font-size:14px;display:none}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="top"><h1>Офис ботов</h1><div class="sub" id="updated">Загружаю…</div><div id="stats"></div></div>
<div id="hint">Двумя пальцами: крутить · наклонять · приближать</div>
<div id="bar">
  <button id="rotL" aria-label="Повернуть влево">⟲</button>
  <button id="topv" class="txt">Сверху</button>
  <button id="rotR" aria-label="Повернуть вправо">⟳</button>
  <button id="snd" aria-label="Звук">🔇</button>
</div>
<div id="err"></div>
<script type="module" src="./office.js"></script>
</body>
</html>
